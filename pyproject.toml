[tool.ruff]
extend-exclude = [
    './alembic',
    './src',
]

# Allow lines to be as long as 120 characters.
line-length = 120

[tool.ruff.lint]
select = [
    'E', 
    'F', 
    'Q', 
    # 'I',    # import sort
    'INP001', # Checks for packages that are missing an __init__.py file.
]
extend-ignore = [
    'Q003', # avoidable-escaped-quote
    'E712', # true-false-comparison (interferes with sqlAlchemy queries)
]

[tool.ruff.lint.flake8-quotes]
inline-quotes = 'single'
multiline-quotes = 'single'

[tool.ruff.format]
# Prefer single quotes over double quotes
quote-style = 'single'

[tool.ruff.lint.extend-per-file-ignores]
'hdx_hapi/config/doc_snippets.py' = ['E501'] # line too long

[tool.black]
line-length = 120
skip-string-normalization = true

[tool.pytest.ini_options]
addopts = """
    --cov=classifiers
    --cov=llm_model
    --cov=models
    --cov=utils
    --cov-report=term-missing
    --cov-report=html
    --ignore=src
"""

# ✅ Coverage config added here
[tool.coverage.run]
omit = [
    "*/__init__.py",
]

[tool.coverage.report]
show_missing = true
