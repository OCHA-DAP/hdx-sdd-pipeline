[tool.ruff]
extend-exclude = [
    './alembic',
]

# Allow lines to be as long as 120 characters.
line-length = 120

[tool.ruff.lint]
select = [
    'E', 
    'F', 
    'Q', 
    # 'I',    # import sort
    'INP001', # Checks for packages that are missing an __init__.py file.
]
extend-ignore = [
    'Q003', # avoidable-escaped-quote
    'E712', # true-false-comparison (interferes with sqlAlchemy queries)
]

[tool.ruff.lint.flake8-quotes]
inline-quotes = 'single'
multiline-quotes = 'double'

[tool.ruff.format]
# Prefer single quotes over double quotes
quote-style = 'single'

[tool.ruff.lint.extend-per-file-ignores]
'hdx_hapi/config/doc_snippets.py' = ['E501'] # line too long

[tool.black]
line-length = 120
skip-string-normalization = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# Coverage options - uncomment if needed
addopts = """
    --cov=src
    --cov-report=term-missing
    --cov-report=html

 """

# ✅ Coverage config added here
[tool.coverage.run]
omit = [
    "*/__init__.py",
]

[tool.coverage.report]
show_missing = true

[project]
name = "hdx-ssd-pipeline"
version = "0.1.0"
description = "HDX SSD pipeline"
requires-python = ">=3.10"

dependencies = [
    "dotenv>=0.9.9",
    "fastapi>=0.128.0",
    "jinja2>=3.1.6",
    "numpy",
    "openai>=2.7.1",
    "openpyxl>=3.1.5",
    "pandas",
    "pydantic-settings>=2.12.0",
    "pytest>=8.4.2",
    "python-multipart>=0.0.21",
    "requests>=2.32.5",
    "scikit-learn>=1.7.2",
    "slack-sdk>=3.40.0",
    "tabulate>=0.9.0",
    "uvicorn>=0.40.0",
]
